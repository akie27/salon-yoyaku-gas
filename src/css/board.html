<style>
/* 上部（日付・週の帯）と予約表 */
/* 上部 */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px}
.row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-size:14px;color:var(--sub);letter-spacing:.04em;margin-right:auto}
.mode{font-size:13px;color:var(--sub);padding:4px 10px;border:1px solid var(--line);border-radius:99px}
.row2{display:flex;align-items:center;gap:10px;margin-top:6px}
.bigdate{font-size:clamp(28px,5vw,40px);font-weight:900;letter-spacing:.02em;margin:0 auto 0 0;line-height:1.1}
.bigdate small{font-size:.55em;font-weight:700;margin-left:.2em}
.nav{min-width:64px;min-height:56px;border:1px solid var(--line);background:var(--paper);border-radius:14px;font-size:22px;font-weight:700}
.today{min-height:56px;padding:0 18px;border:1px solid var(--line);background:var(--paper);border-radius:14px;font-weight:700}
.find{min-height:56px;padding:0 20px;border:0;background:var(--ink);color:var(--paper);border-radius:14px;font-weight:700}

/* 週の空き具合（この画面の主役） */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 4px 8px;text-align:center;min-height:78px;display:flex;flex-direction:column;align-items:center;gap:2px}
.wd .dw{font-size:13px;color:var(--sub)}
.wd .dn{font-size:22px;font-weight:900;line-height:1.1}
.wd .meter{width:78%;height:8px;border-radius:4px;background:var(--slot);overflow:hidden;border:1px solid var(--line);margin-top:4px}
.wd .meter i{display:block;height:100%;background:var(--ink)}
.wd .cap{font-size:12px;color:var(--sub)}
.wd.sel{border:2px solid var(--ink);padding:5px 3px 7px}
.wd.closed{opacity:.55}
.wd.sun .dw{color:var(--danger)}
.wd.istoday .dn{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:3px}

/* 置く場所モード */
.placebar{display:none;margin-top:10px;background:var(--free);color:#fff;border-radius:14px;padding:12px 14px;align-items:center;gap:12px}
.placebar.on{display:flex}
.placebar p{margin:0;flex:1;font-weight:700}
.placebar button{min-height:48px;padding:0 16px;border-radius:12px;border:2px solid #fff;background:transparent;color:#fff;font-weight:700}

/* 予約表 */
.board{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.heads{display:grid;border-bottom:1px solid var(--line)}
.heads div{padding:10px 8px;font-weight:700;text-align:center;font-size:17px}
.heads div + div{border-left:1px solid var(--line)}
.grid{display:grid;position:relative}
.times div{height:var(--row);font-size:14px;color:var(--sub);text-align:right;padding:2px 8px 0 0;border-top:1px solid transparent}
.times div.hour{color:var(--ink);font-weight:700;border-top-color:var(--line)}
.col{position:relative;border-left:1px solid var(--line)}
.slot{position:absolute;left:0;right:0;border:0;border-top:1px solid var(--line);background:var(--slot);
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:15px;font-weight:700}
.slot.half{border-top-style:dashed}
.slot:hover,.slot:active{background:var(--slot-hover);color:var(--free)}
.placing .slot{color:var(--free)}
.placing .slot.nofit{color:transparent;background:var(--slot);cursor:not-allowed}
.bk{position:absolute;left:5px;right:5px;border-radius:10px;border:0;text-align:left;padding:6px 10px;overflow:hidden;
  display:flex;flex-direction:column;gap:0;border-left:6px solid}
.bk b{font-size:17px;line-height:1.3}
.bk span{font-size:14px;line-height:1.35;opacity:.9}
.bk{color:var(--ink)}
.scroller{overflow-x:auto}
.setbtn{min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--paper);border-radius:12px;font-size:15px;font-weight:700}

.bk.moving{outline:3px dashed var(--free);opacity:.55}
.nowline{position:absolute;left:0;right:0;height:0;border-top:3px solid var(--now);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-6px;top:-7px;width:11px;height:11px;border-radius:50%;background:var(--now)}
.closedmsg{padding:60px 20px;text-align:center;color:var(--sub);font-size:20px}
.hint{color:var(--sub);font-size:15px;margin:10px 4px 0}

/* スマホ幅 */
@media (max-width:640px){
  body{font-size:17px}
  .row2{flex-wrap:wrap}
  .bigdate{width:100%}
  .find{flex:1}
  .wd .cap{display:none}
  .wd{min-height:66px}
}
</style>
