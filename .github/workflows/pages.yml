name: デモを GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch:   # Actions タブから手動でも実行できるようにする

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: プレビューを作る
        run: node tools/preview.mjs
      - name: 公開用フォルダにまとめる
        run: mkdir _site && cp dev/preview.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
